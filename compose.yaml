# Local development services: Postgres, an S3 server for media files and Mailpit,
# which catches the emails the API sends.
#
#   docker compose up -d          # start them in the background
#   docker compose down           # stop them (data is kept in the named volumes)
#   docker compose down -v        # stop them and delete the data
#
# `.cargo/config.toml` points the host and the tests at both:
#   DATABASE_URL=postgres://hypha:hypha@localhost:5432/hypha
#   HYPHA_TEST_DATABASE_URL=postgres://hypha:hypha@localhost:5433/hypha (the tests')
#   HYPHA_S3_ENDPOINT=http://localhost:8333 (bucket hypha-media, created on first use)
#   HYPHA_EMAIL_SENDER=smtp, HYPHA_SMTP_HOST=localhost, HYPHA_SMTP_PORT=1025 (Mailpit;
#   its inbox is http://localhost:8025)
#
# Development only: the credentials are not secret.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hypha
      POSTGRES_PASSWORD: hypha
      POSTGRES_DB: hypha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypha -d hypha"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The tests' own Postgres (`HYPHA_TEST_DATABASE_URL`): in memory and without
  # durability, since every test database is a throwaway copy of a migrated template.
  # Never point anything you want to keep at it; a restart empties it.
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hypha
      POSTGRES_PASSWORD: hypha
      POSTGRES_DB: hypha
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=300
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypha -d hypha"]
      interval: 2s
      timeout: 3s
      retries: 15

  # SeaweedFS's S3 gateway. MinIO was the plan, but its community edition stopped
  # publishing images in October 2025; SeaweedFS passes the `blob_store` contract
  # (signatures, sizes, types, checksums, expiry) and answers browsers' CORS requests.
  # Credentials are in dev/seaweedfs-s3.json.
  s3:
    image: chrislusf/seaweedfs:4.48
    # Capacity is set, not derived from the machine's free disk: by default the volume
    # server allows (free space / volume size) volumes, which on a CI runner's small disk
    # is a handful, all taken by the first collection, so uploads to `hypha-media` failed
    # ("no free volumes left"). 50 volumes of 100 MB: 5 GB, plenty for development.
    # Master, volume server and gateway reach each other over loopback (`-ip`) and
    # listen on every interface for the published port (`-ip.bind`).
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=100 -volume.max=50
      -s3 -s3.port=8333 -s3.config=/config/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./dev/seaweedfs-s3.json:/config/s3.json:ro

  # Mailpit: an SMTP server that delivers nowhere, with an inbox to read what arrived
  # (http://localhost:8025) and an API the end-to-end script checks. Messages are kept
  # in memory, so a restart empties it.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  s3-data:
