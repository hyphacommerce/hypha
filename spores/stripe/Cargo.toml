[package]
name = "hypha-spore-stripe"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Stripe payments built into Hypha's API: the payment provider, Stripe's webhook, the order.payment block and the storefront's <stripe-payment> element."

# A spore depends on the facade only, and builds for wasm like every spore:
# Stripe is called through the host's HTTP client.
[dependencies]
hypha-spore = { path = "../../crates/hypha-spore", features = ["http"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
hypha-spore = { path = "../../crates/hypha-spore", features = ["http", "testing"] }
pollster = "0.4"

[lints]
workspace = true
