[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0-beta.2"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hypha-core = { path = "crates/hypha-core" }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
# `pub` on an item nothing outside its crate can reach reads as API it isn't.
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Panics: tests may (clippy.toml); elsewhere only a documented invariant, with an
# `#[expect(…, reason = "…")]` naming it.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Silent truncation and sign loss: say why a cast fits, or convert with `try_from`.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Ownership: small `Copy` values by value, values a function only reads by reference.
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
# Signatures that promise more than the body does.
unused_async = "warn"
unnecessary_wraps = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
# Password hashing is slow on purpose, and unoptimized it is many times slower still,
# which would make logins in dev builds and tests crawl. Optimize just these crates.
# Debug info is most of what a build writes (on macOS it stays in an object file per
# codegen unit beside each test binary, and Cargo never deletes old ones). Line tables
# keep file:line in backtraces and panics; dependencies get none. Set `debug = true`
# locally to step through variables in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
