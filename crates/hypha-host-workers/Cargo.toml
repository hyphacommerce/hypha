[package]
name = "hypha-host-workers"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Hypha's API on Cloudflare Workers (design note 0026): hypha-http's routes over Hyperdrive."

[lib]
crate-type = ["cdylib", "rlib"]

# The portable parts (`app_bindings`, `ids`, `limiter`, `marks`, `peer`, `schedule`) build natively, so their tests run with the
# workspace's.
[dependencies]
hypha-http = { path = "../hypha-http" }
hypha-core.workspace = true
hypha-config = { path = "../hypha-config" }
uuid = { workspace = true }
url = "2.5"

# The Worker itself: `cargo build --target wasm32-unknown-unknown -p hypha-host-workers`
# and `worker-build` build it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
hypha-dispatch = { path = "../hypha-dispatch" }
hypha-apps = { path = "../hypha-apps" }
hypha-payments = { path = "../hypha-payments" }
# The spores a deployment is built with (design note 0030, `worker!`).
hypha-spore-core = { path = "../hypha-spore-core" }
# Spores' configuration sections (`[spores.<name>]`).
toml = "0.9"
hypha-merchandising = { path = "../hypha-merchandising" }
hypha-search = { path = "../hypha-search" }
hypha-store-postgres = { path = "../hypha-store-postgres" }
hypha-store-s3 = { path = "../hypha-store-s3" }
hypha-stores = { path = "../hypha-stores" }
hypha-notifications = { path = "../hypha-notifications" }
hypha-mail = { path = "../hypha-mail" }
hypha-mail-resend = { path = "../hypha-mail-resend" }
worker = { version = "=0.8.7", features = ["http", "axum", "tokio-postgres"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "original-uri"] }
tower-service = "0.3"
serde = { workspace = true }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js", "with-uuid-1"] }
wasm-bindgen-futures = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `crypto.getRandomValues` (this crate depends on wasm-bindgen anyway).
getrandom = { version = "0.4", features = ["wasm_js"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# `stock`: this crate exports the stock Worker's events (`worker! { spores: [] }`). A
# deployment's own crate turns it off and invokes `worker!` with its spores.
[features]
default = ["stock"]
stock = []

[dev-dependencies]
toml = "0.9"

[lints]
workspace = true
