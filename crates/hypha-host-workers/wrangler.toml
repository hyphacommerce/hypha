# The API on Cloudflare Workers (design note 0026). `wrangler dev` runs it against the
# compose Postgres (`localConnectionString`), on a database `hypha-host-axum setup`
# prepared first (W9); `hypha deploy --target cloudflare` writes a deployment's own file.
name = "hypha-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# Postgres through Hyperdrive. The id is the deployment's, created with its query cache
# OFF: `wrangler hyperdrive create hypha --connection-string=… --caching-disabled`.
# Hyperdrive caches reads outside a transaction for up to a minute by default, and the
# API's are not cacheable: a revoked key or ended session would keep working, a session
# that just passed MFA would read as pending (design note 0026, W4).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://hypha:hypha@localhost:5432/hypha_workers"

# The jobs' marks (W7): a tick reads them first and touches Postgres only when there's
# work, so an idle serverless database can sleep. `hypha deploy` creates the namespace
# (`wrangler kv namespace create`); `wrangler dev` simulates it locally.
[[kv_namespaces]]
binding = "JOBS"
id = "00000000000000000000000000000000"

# Rate limits (W8): a binding per rule, capping all isolates together; each isolate also
# counts the exact quota (`src/limiter.rs`). The limit is the most the rule's
# `[rate_limits]` quota allows in a minute (burst + one per period that fits); these are
# the defaults', and `hypha deploy` writes a deployment's own. A namespace_id is unique
# per account: two deployments on one account need different ones.
[[ratelimits]]
name = "RL_LOGIN_IP"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_LOGIN_EMAIL_FROM_IP"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_LOGIN_EMAIL"
namespace_id = "1003"
simple = { limit = 50, period = 60 }

[[ratelimits]]
name = "RL_MFA_IP"
namespace_id = "1004"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_RESET_IP"
namespace_id = "1005"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_RESET_EMAIL_FROM_IP"
namespace_id = "1006"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_RESET_CONFIRM_IP"
namespace_id = "1007"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_INVITE_IP"
namespace_id = "1008"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_SHIPPING_QUOTES_CART"
namespace_id = "1009"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "RL_CART_CREATE_IP"
namespace_id = "1010"
simple = { limit = 40, period = 60 }

# One tick a minute (W6): dispatch and search sync when the marks say so, prune and the media sweep
# on the ticks that start their `jobs.<job>.interval` (hourly by default).
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Run next to the database: its round trips are most of a request (§8, W12). `hypha
# deploy` sets it to the database's host (Cloudflare measures it), or `region` with
# `hypha init --region`.
# [placement]
# mode = "targeted"
# host = "db.example.com:5432"
