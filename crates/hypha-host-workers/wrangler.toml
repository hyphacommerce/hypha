# The API on Cloudflare Workers (design note 0026). `wrangler dev` runs it against the
# compose Postgres (`localConnectionString`), on a database `hypha-host-axum setup`
# prepared first (W9); `hypha deploy` (later) writes the deployment's own values.
name = "hypha-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# Postgres through Hyperdrive. The id is the deployment's, created with its query cache
# OFF: `wrangler hyperdrive create hypha --connection-string=… --caching-disabled`.
# Hyperdrive caches reads outside a transaction for up to a minute by default, and the
# API's are not cacheable: a revoked key or ended session would keep working, a session
# that just passed MFA would read as pending (design note 0026, W4).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://hypha:hypha@localhost:5432/hypha_workers"

# The jobs' marks (W7): a tick reads them first and touches Postgres only when there's
# work, so an idle serverless database can sleep. `hypha deploy` creates the namespace
# (`wrangler kv namespace create`); `wrangler dev` simulates it locally.
[[kv_namespaces]]
binding = "JOBS"
id = "00000000000000000000000000000000"

# One tick a minute (W6): dispatch and search sync when the marks say so, prune and the media sweep
# on the ticks that start their `jobs.<job>.interval` (hourly by default).
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Run next to the database: its round trips are most of a request (§8). Set to the
# database's region, e.g. "aws:eu-central-1" for Neon in Frankfurt.
# [placement]
# region = "aws:eu-central-1"
