[package]
name = "hypha-store-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hypha-core.workspace = true
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-stores = { path = "../hypha-stores" }
uuid.workspace = true
# No runtime feature: the adapter never opens connections, hosts hand it a Client.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["with-uuid-1"] }
# Runtime-agnostic async mutex (works on native and on Workers).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# On Cloudflare Workers (through Hyperdrive) tokio-postgres needs its `js` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js"] }

[dev-dependencies]
hypha-testkit = { path = "../hypha-testkit" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.18" }

[lints]
workspace = true
