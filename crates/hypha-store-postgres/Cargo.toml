[package]
name = "hypha-store-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hypha-core.workspace = true
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-stores = { path = "../hypha-stores" }
hypha-orders = { path = "../hypha-orders" }
hypha-fulfillment = { path = "../hypha-fulfillment" }
hypha-auth = { path = "../hypha-auth" }
hypha-users = { path = "../hypha-users" }
hypha-apps = { path = "../hypha-apps" }
hypha-oauth = { path = "../hypha-oauth" }
hypha-media = { path = "../hypha-media" }
hypha-shipping = { path = "../hypha-shipping" }
hypha-search-index = { path = "../hypha-search-index" }
hypha-channels = { path = "../hypha-channels" }
hypha-categories = { path = "../hypha-categories" }
hypha-payments = { path = "../hypha-payments" }
hypha-notifications = { path = "../hypha-notifications" }
hypha-extensions = { path = "../hypha-extensions" }
hypha-custom-fields = { path = "../hypha-custom-fields" }
serde_json.workspace = true
uuid.workspace = true
# No runtime feature: the adapter never opens connections, hosts hand it a Client.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["with-uuid-1"] }
# Runtime-agnostic async mutex (works on native and on Workers).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Test databases copied from a migrated template (`testing`); native only, opens its own
# connections.
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
testing = ["dep:tokio", "tokio-postgres/runtime"]

# On Cloudflare Workers (through Hyperdrive) tokio-postgres needs its `js` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js"] }

[dev-dependencies]
hypha-store-postgres = { path = ".", features = ["testing"] }
# Workflows sit above this adapter; only the race tests drive one.
hypha-checkout = { path = "../hypha-checkout" }
hypha-order-actions = { path = "../hypha-order-actions" }
hypha-testkit = { path = "../hypha-testkit", features = ["contract"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.18" }

[lints]
workspace = true
