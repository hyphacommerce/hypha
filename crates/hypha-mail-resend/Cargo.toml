[package]
name = "hypha-mail-resend"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Hypha's Resend email sender (design note 0028, §5): the `EmailSender` port over an `HttpClient` the host gives it."

[dependencies]
hypha-core.workspace = true
hypha-notifications = { path = "../hypha-notifications" }
serde.workspace = true
serde_json.workspace = true

# A native `HttpClient` (`ReqwestClient`) for hosts and tests. Workers builds bring
# their own (`fetch`), so wasm doesn't get it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
pollster = "0.4"
uuid.workspace = true

[lints]
workspace = true
