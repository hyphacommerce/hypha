[package]
name = "hypha-http"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Hypha's HTTP layer (design note 0026, W3): routes, extractors, errors, DTOs, OpenAPI and the host state, shared by the hosts."

[dependencies]
hypha-core = { workspace = true, features = ["openapi"] }
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-stores = { path = "../hypha-stores" }
hypha-orders = { path = "../hypha-orders" }
hypha-checkout = { path = "../hypha-checkout" }
hypha-fulfillment = { path = "../hypha-fulfillment" }
hypha-order-actions = { path = "../hypha-order-actions" }
hypha-payments = { path = "../hypha-payments" }
hypha-auth = { path = "../hypha-auth" }
hypha-users = { path = "../hypha-users" }
hypha-dispatch = { path = "../hypha-dispatch" }
hypha-search = { path = "../hypha-search" }
hypha-search-index = { path = "../hypha-search-index" }
hypha-channels = { path = "../hypha-channels" }
hypha-categories = { path = "../hypha-categories" }
hypha-media = { path = "../hypha-media" }
hypha-merchandising = { path = "../hypha-merchandising" }
hypha-shipping = { path = "../hypha-shipping" }
hypha-apps = { path = "../hypha-apps" }
hypha-oauth = { path = "../hypha-oauth" }
hypha-notifications = { path = "../hypha-notifications" }
hypha-mail = { path = "../hypha-mail" }
hypha-store-s3 = { path = "../hypha-store-s3" }
hypha-config = { path = "../hypha-config" }
utoipa = "6"
pastey = "0.2"
ipnet = "2"
# No Tokio: the hosts serve (design note 0026, W2).
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "original-uri", "macros"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
thiserror.workspace = true
uuid = { workspace = true }
tracing = "0.1"
sha2 = "0.11"
hmac = "0.13"
jiff = "0.2"
base64 = "0.22"
serde_html_form = "0.4.1"
# The WHATWG URL parser (as reqwest uses): an IP literal is read as the address it connects to.
url = "2.5"

[dev-dependencies]
pollster = "0.4"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
