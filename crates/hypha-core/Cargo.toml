[package]
name = "hypha-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
url = "2.5"
# Sanitising rich descriptions (products, categories); builds for wasm.
ammonia = "4.2.3"
# Only for hosts that publish OpenAPI documents: domain crates and wasm builds never
# turn it on.
utoipa = { version = "6", optional = true }
# Event payloads are JSON values; builds for wasm.
serde_json.workspace = true

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true