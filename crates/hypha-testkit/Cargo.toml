[package]
name = "hypha-testkit"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hypha-core.workspace = true
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-stores = { path = "../hypha-stores" }
hypha-orders = { path = "../hypha-orders" }
hypha-fulfillment = { path = "../hypha-fulfillment" }
hypha-auth = { path = "../hypha-auth" }
hypha-users = { path = "../hypha-users" }
hypha-media = { path = "../hypha-media" }
hypha-shipping = { path = "../hypha-shipping" }
hypha-apps = { path = "../hypha-apps" }
hypha-search-index = { path = "../hypha-search-index" }
sha2 = "0.11"
uuid.workspace = true
# The contract's outbox scenarios stage events of their own and read their payloads.
serde.workspace = true
serde_json.workspace = true

[features]
# The repository contract suite (`contract`): adapters run it from their tests. Off by
# default so it doesn't ship in host binaries that use the in-memory repos.
contract = []

[dev-dependencies]
pollster = "0.4"

[[test]]
name = "contract"
required-features = ["contract"]

[lints]
workspace = true
