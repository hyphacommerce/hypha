[package]
name = "hypha-host-axum"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
hypha-core.workspace = true
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-testkit = { path = "../hypha-testkit" }
hypha-store-postgres = { path = "../hypha-store-postgres" }
hypha-stores = { path = "../hypha-stores" }
deadpool-postgres = "0.14.2"
tokio-postgres = "0.7.18"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }

[lints]
workspace = true