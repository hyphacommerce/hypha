[package]
name = "hypha-host-axum"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The routes, the state and everything else but startup (design note 0026, W3).
hypha-http = { path = "../hypha-http" }
hypha-core = { workspace = true }
hypha-config = { path = "../hypha-config" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-search-index = { path = "../hypha-search-index" }
hypha-stores = { path = "../hypha-stores" }
hypha-users = { path = "../hypha-users" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
