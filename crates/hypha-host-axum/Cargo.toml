[package]
name = "hypha-host-axum"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The routes, the state and everything but the runtime (design note 0026, W3).
hypha-http = { path = "../hypha-http" }
hypha-dispatch = { path = "../hypha-dispatch" }
hypha-merchandising = { path = "../hypha-merchandising" }
hypha-search = { path = "../hypha-search" }
hypha-core = { workspace = true, features = ["openapi"] }
hypha-config = { path = "../hypha-config" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-search-index = { path = "../hypha-search-index" }
hypha-store-postgres = { path = "../hypha-store-postgres" }
hypha-store-s3 = { path = "../hypha-store-s3" }
hypha-stores = { path = "../hypha-stores" }
hypha-users = { path = "../hypha-users" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["v7"] }
getrandom = "0.4"
# The in-memory rate limiter (`limiter.rs`).
governor = "0.10"
# Calls to merchant URLs (`calls.rs`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Postgres (`storage.rs`): a deadpool pool, under our manager so each connection keeps
# its prepared statements; TLS verified against the OS trust store.
deadpool-postgres = "0.14.2"
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
rustls-platform-verifier = "0.7"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# `config rate-limits` prints JSON.
serde_json.workspace = true

[dev-dependencies]
# The route tests (`route_tests.rs`).
hypha-auth = { path = "../hypha-auth" }
hypha-apps = { path = "../hypha-apps" }
hypha-markets = { path = "../hypha-markets" }
hypha-products = { path = "../hypha-products" }
jiff = "0.2"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
