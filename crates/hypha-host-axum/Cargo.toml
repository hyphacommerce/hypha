[package]
name = "hypha-host-axum"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# First-party spores, built in by a feature (design note 0030, §9): `--features
# spore-stripe`. The stock binary has none.
hypha-spore-stripe = { path = "../../spores/stripe", optional = true }
# The routes, the state and everything but the runtime (design note 0026, W3).
hypha-http = { path = "../hypha-http" }
hypha-dispatch = { path = "../hypha-dispatch" }
hypha-payments = { path = "../hypha-payments" }
hypha-merchandising = { path = "../hypha-merchandising" }
hypha-search = { path = "../hypha-search" }
hypha-core = { workspace = true, features = ["openapi"] }
hypha-config = { path = "../hypha-config" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-search-index = { path = "../hypha-search-index" }
hypha-store-postgres = { path = "../hypha-store-postgres" }
# The spores a deployment is built with (design note 0030, `host!`).
hypha-spore-core = { path = "../hypha-spore-core" }
# Registering each spore's app at startup.
hypha-apps = { path = "../hypha-apps" }
hypha-store-s3 = { path = "../hypha-store-s3" }
hypha-stores = { path = "../hypha-stores" }
hypha-users = { path = "../hypha-users" }
hypha-notifications = { path = "../hypha-notifications" }
hypha-mail = { path = "../hypha-mail" }
hypha-mail-resend = { path = "../hypha-mail-resend" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["v7"] }
getrandom = "0.4"
# The in-memory rate limiter (`limiter.rs`).
governor = "0.10"
# Calls to merchant URLs (`calls.rs`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Postgres (`storage.rs`): a deadpool pool, under our manager so each connection keeps
# its prepared statements; TLS verified against the OS trust store.
deadpool-postgres = "0.14.2"
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
rustls-platform-verifier = "0.7"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# The SMTP email sender (`email.rs`, design note 0028): Tokio and rustls with aws-lc-rs,
# certificates checked by the OS's verifier as Postgres's are; no native-tls/OpenSSL.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
# `config rate-limits` prints JSON.
serde_json.workspace = true
# Spores' configuration sections (`[spores.<name>]`).
toml = "0.9"

[features]
# The Stripe spore (design note 0030, SP9).
spore-stripe = ["dep:hypha-spore-stripe"]

[dev-dependencies]
# The first-party Stripe spore, for route tests of a host built with it (design note
# 0030, SP9); the stock binary has no spores.
hypha-spore-stripe = { path = "../../spores/stripe" }
url = "2.5"
# A test host for building spores (`hypha_spore_core::env::testing`).
hypha-spore-core = { path = "../hypha-spore-core", features = ["testing"] }
serde.workspace = true
# The route tests (`route_tests.rs`).
hypha-auth = { path = "../hypha-auth" }
hypha-markets = { path = "../hypha-markets" }
hypha-products = { path = "../hypha-products" }
jiff = "0.2"
tower = { version = "0.5.3", features = ["util"] }
# Reading apps' session tokens (JWTs) in the route tests.
base64 = "0.22"

[lints]
workspace = true
