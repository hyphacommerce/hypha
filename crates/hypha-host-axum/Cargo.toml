[package]
name = "hypha-host-axum"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
hypha-core = { workspace = true, features = ["openapi"] }
hypha-products = { path = "../hypha-products" }
hypha-markets = { path = "../hypha-markets" }
hypha-cart = { path = "../hypha-cart" }
hypha-tax = { path = "../hypha-tax" }
hypha-inventory = { path = "../hypha-inventory" }
hypha-customers = { path = "../hypha-customers" }
hypha-testkit = { path = "../hypha-testkit" }
hypha-store-postgres = { path = "../hypha-store-postgres" }
hypha-stores = { path = "../hypha-stores" }
hypha-orders = { path = "../hypha-orders" }
hypha-checkout = { path = "../hypha-checkout" }
hypha-auth = { path = "../hypha-auth" }
hypha-users = { path = "../hypha-users" }
getrandom = "0.4"
governor = "0.10"
utoipa = "6"
pastey = "0.2"
ipnet = "2"
deadpool-postgres = "0.14.2"
tokio-postgres = "0.7.18"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
jiff = "0.2"
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true