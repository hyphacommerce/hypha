[package]
name = "hypha-auth"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hypha-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pure Rust, so everything here compiles for wasm32 too. Randomness comes in through
# `hypha_core::Random`, never from these crates (their `getrandom` features are off).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
uuid.workspace = true
hypha-testkit = { path = "../hypha-testkit" }
pollster = "1.0"

[lints]
workspace = true
