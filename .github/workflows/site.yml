# Deploys hyphacommerce.com (apps/site) to Cloudflare when what it's built from changes:
# its own code, the OpenAPI documents (the API reference), the docs and blog content, or
# the changelog. Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit
# on the account, Workers Routes: Edit on the zone); without it the job only builds.
name: Site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - openapi/**
      - CHANGELOG.md
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter site...
      - run: pnpm --filter site build
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/site
        run: pnpm exec wrangler deploy
