# Every check CLAUDE.md lists before work counts as done, on each push to main and each
# pull request. The services come from compose.yaml, as in local development.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start Postgres, the S3 server and Mailpit
        run: docker compose up -d --wait
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p hypha-host-axum --features spore-stripe -- -D warnings
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest
      # Includes the OpenAPI freshness test and the Postgres and S3 contracts. nextest runs
      # no doc tests, so they run apart.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - name: Core, domain crates, adapters and the HTTP layer build for wasm32
        run: >
          cargo build --target wasm32-unknown-unknown
          -p hypha-core -p hypha-products -p hypha-markets -p hypha-pricing -p hypha-cart
          -p hypha-tax -p hypha-inventory -p hypha-customers -p hypha-stores -p hypha-orders
          -p hypha-fulfillment -p hypha-order-actions -p hypha-payments -p hypha-notifications -p hypha-mail
          -p hypha-checkout -p hypha-dispatch -p hypha-auth -p hypha-users -p hypha-media
          -p hypha-merchandising -p hypha-shipping -p hypha-apps -p hypha-oauth -p hypha-channels -p hypha-search-index -p hypha-search -p hypha-config -p hypha-store-postgres -p hypha-store-s3 -p hypha-mail-resend
          -p hypha-categories -p hypha-custom-fields -p hypha-extensions -p hypha-http -p hypha-spore-core -p hypha-host-workers
          -p hypha-spore -p hypha-spore-stripe -p hypha-agents -p hypha-mcp --features hypha-spore/postgres,hypha-spore/http
      # The Worker and the native host with this repository's spores.
      - run: cargo build --target wasm32-unknown-unknown -p hypha-host-workers --features spore-stripe
      - name: The services' logs, when something failed
        if: failure()
        run: docker compose logs --tail 200 s3 postgres mailpit
      - name: End-to-end against a fresh host
        run: |
          docker compose exec -T postgres psql -U hypha -c "CREATE DATABASE hypha_e2e"
          cargo build -p hypha-host-axum
          DATABASE_URL=postgres://hypha:hypha@localhost:5432/hypha_e2e \
          HYPHA_SECRET_KEY="$(openssl rand -hex 32)" \
          HYPHA_OWNER_EMAIL=owner@example.com HYPHA_OWNER_PASSWORD=e2e-owner-password \
          HYPHA_BIND=127.0.0.1:3000 \
          HYPHA_ALLOW_PRIVATE_CALLBACKS=true HYPHA_ADMIN_URL=http://admin.e2e.test \
            cargo run -p hypha-host-axum > host.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          bash scripts/e2e.sh
      - name: Host log
        if: failure()
        run: cat host.log || true

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Oxfmt and Oxlint (Vite+, the root vite.config.ts), then React Doctor (doctor.config.ts).
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm lint:react
      - run: pnpm sdk:check
      # The spores' storefront elements as bundled.
      - run: pnpm spores:check
      # The default email templates and their contract with the API.
      - run: pnpm emails:check
      - run: pnpm --filter @hyphacommerce/emails test
      # The apps platform's packages: the SDK (and its extension types against
      # openapi/extensions.json), the bridge, blocks and storefront elements.
      - run: pnpm --filter @hyphacommerce/app check
      - run: pnpm --filter @hyphacommerce/app test
      - run: pnpm --filter @hyphacommerce/app-bridge test
      - run: pnpm --filter @hyphacommerce/app-bridge-host test
      - run: pnpm --filter @hyphacommerce/app-blocks test
      - run: pnpm --filter @hyphacommerce/storefront-elements test
      # The deploy CLI, and the apps' plain helpers.
      - run: pnpm --filter @hyphacommerce/cli test
      - run: pnpm --filter admin test
      - run: pnpm --filter storefront test
      - run: pnpm --filter admin theme:check
      - run: pnpm --filter storefront theme:check
      - run: pnpm typecheck
      # Standard Next.js still builds the admin.
      - run: pnpm --filter admin exec next build
      # And the storefront.
      - run: pnpm --filter storefront exec next build
