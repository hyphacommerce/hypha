# Keeps the release pull request open against main: the changelog and every version bump
# (the workspace version in Cargo.toml, each package.json, the OpenAPI documents' version),
# from the Conventional Commits since the last tag. Merging it tags the release (v0.1.0-beta.1,
# …) and publishes a GitHub Release, marked a pre-release while the version is one.
# Cargo.lock holds each crate's version too, so the second job refreshes it on the release
# branch after release-please moved Cargo.toml.
#
# With the workflow's own token, nothing release-please does starts another workflow (GitHub's
# rule for GITHUB_TOKEN): the release PR gets no CI run and the published release doesn't start
# "Publish release". The secret RELEASE_PLEASE_TOKEN (a fine-grained personal access token on
# this repository with Contents and Pull requests read and write) lifts that; without it the
# publish is started by hand (`gh workflow run "Publish release" -f tag=v…`).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4 (v5.0.0)
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The lock file names every workspace crate with its version; release-please can't update
  # it, so it is re-resolved for the workspace members only (no dependency moves) and
  # committed to the release branch.
  cargo-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - run: cargo update --workspace
      - run: |
          if git diff --quiet Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh Cargo.lock for the release"
          git push
