# Publishes a release once release-please has tagged it (the GitHub Release it creates):
# the npm packages with provenance through trusted publishing (no token: each package on
# npmjs.com names this repository and this workflow file as its publisher), the API, admin
# and storefront images on GHCR for amd64 and arm64 (each built on a runner of its own
# architecture, then joined in one manifest), and the API's Workers bundle attached to the
# release. A pre-release (a version with a hyphen: 0.1.0-beta.1) goes to npm's `next`
# dist-tag and the images' `next` tag; a release to `latest`, `X.Y.Z` and `X.Y`.
name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish again (v0.1.0-beta.1)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - id: v
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm packages:check
      - name: Licence files into each package
        run: for d in packages/*/; do cp LICENSE-MIT LICENSE-APACHE "$d"; done
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          DIST_TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag "$DIST_TAG"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [api, admin, storefront]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image == 'api' && 'docker/api.Dockerfile' || 'docker/app.Dockerfile' }}
          build-args: ${{ matrix.image != 'api' && format('APP={0}', matrix.image) || '' }}
          platforms: linux/${{ matrix.platform.arch }}
          # By digest only; the manifest job gives the tags.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hypha-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }},mode=max
      - run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, admin, storefront]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/hypha-${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = true ]; then
            tags+=(-t "$IMAGE:next")
          else
            tags+=(-t "$IMAGE:$MINOR" -t "$IMAGE:latest")
          fi
          refs=()
          for d in digests/*; do refs+=("$IMAGE@$(cat "$d")"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  workers-bundle:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install worker-build --locked
      - name: Build the API for Workers
        working-directory: crates/hypha-host-workers
        run: worker-build --release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -czf "hypha-api-workers-$VERSION.tar.gz" -C crates/hypha-host-workers build wrangler.toml
          gh release upload "$TAG" "hypha-api-workers-$VERSION.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
