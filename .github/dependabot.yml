# Weekly dependency PRs, at most two per ecosystem: minor and patch updates together, majors
# together (to read before merging). Each PR runs the whole CI, which private repositories
# pay for in Actions minutes, hence the grouping. A release must be a week old before it's
# proposed (`cooldown`): most compromised packages are caught sooner. Security updates aren't
# held back by either.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  # The pnpm workspace from its root: one PR covers every package that uses a dependency.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Astryx is 0.x and pinned exactly: its updates come on their own, to be read first.
      astryx:
        patterns: ["@astryxdesign/*"]
      npm:
        update-types: [minor, patch]
        exclude-patterns: ["@astryxdesign/*"]
      npm-major:
        update-types: [major]
        exclude-patterns: ["@astryxdesign/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
