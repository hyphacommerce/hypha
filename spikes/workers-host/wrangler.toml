name = "hypha-workers-spike"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e784c457396d4446a8df31c612eb6958"

[observability]
enabled = true

# Run next to the database (Neon, AWS eu-central-1): its round trips are most of a read.
[placement]
region = "aws:eu-central-1"
